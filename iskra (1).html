<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Искра</title>
<link id="favicon" rel="icon">
<style>
:root{--bg:#0f1117;--panel:#171a23;--panel2:#1e2230;--line:#2a2f42;--text:#eef0f6;--muted:#8b91a7;
--a1:#ff8a3d;--a2:#ff4d6d;--grad:linear-gradient(135deg,var(--a1),var(--a2));--mine:#2d2236;--r:16px}
@media(prefers-color-scheme:light){:root{--bg:#f4f5f9;--panel:#fff;--panel2:#f0f1f6;--line:#e2e4ee;--text:#1b1e2b;--muted:#6f758c;--mine:#ffe9dc}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.hidden{display:none!important}
.logo{width:56px;height:56px}

/* auth */
#auth{height:100%;display:grid;place-items:center;padding:20px;background:radial-gradient(600px 400px at 20% 10%,#ff8a3d33,transparent),radial-gradient(600px 400px at 90% 90%,#ff4d6d33,transparent)}
.card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:32px 28px;box-shadow:0 20px 60px #0004}
.brand{text-align:center;margin-bottom:22px}
.brand h1{font-size:30px;margin-top:8px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{color:var(--muted);font-size:13px}
.tabs{display:flex;background:var(--panel2);border-radius:12px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;padding:9px;border-radius:9px;color:var(--muted)}
.tabs button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 4px #0003}
.field{margin-bottom:12px}
.field input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit;outline:0}
.field input:focus{border-color:var(--a1)}
.btn{width:100%;padding:13px;border-radius:12px;background:var(--grad);color:#fff;font-weight:600;margin-top:4px}
.btn:disabled{opacity:.6}
.err{color:#ff6b81;font-size:13px;min-height:18px;margin-top:10px;text-align:center}

/* app */
#app{height:100%;display:grid;grid-template-columns:320px 1fr}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding-top:env(safe-area-inset-top,0)}
.me{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.me b{flex:1;overflow:hidden;text-overflow:ellipsis}
.me .logo{width:30px;height:30px}
.icon-btn{width:36px;height:36px;border-radius:10px;color:var(--muted);font-size:18px}
.icon-btn:hover{background:var(--panel2);color:var(--text)}
#search{margin:12px 16px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit;outline:0}
#list{flex:1;overflow:auto;padding:0 8px 12px}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px;border-radius:14px}
.item:hover{background:var(--panel2)}
.item.on{background:var(--panel2);box-shadow:inset 3px 0 0 var(--a1)}
.ava{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.item small{color:var(--muted);display:block}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.head{display:flex;align-items:center;gap:12px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.head .back{display:none}
#msgs{flex:1;overflow:auto;padding:18px 16px;display:flex;flex-direction:column;gap:6px;
background:radial-gradient(500px 300px at 80% 0,#ff8a3d14,transparent)}
.empty{margin:auto;text-align:center;color:var(--muted)}
.row{display:flex;gap:8px;align-items:flex-end;max-width:100%}
.row.mine{flex-direction:row-reverse}
.row .ava{width:30px;height:30px;font-size:13px}
.bubble{max-width:min(520px,78%);padding:8px 12px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);word-wrap:break-word;overflow-wrap:anywhere}
.mine .bubble{background:var(--mine);border-color:transparent}
.who{font-size:12px;font-weight:600;margin-bottom:2px}
.bubble img{display:block;max-width:100%;max-height:320px;border-radius:12px;margin:2px 0 4px;cursor:zoom-in}
.txt{white-space:pre-wrap}
.time{font-size:11px;color:var(--muted);text-align:right;margin-top:2px}
.day{align-self:center;font-size:12px;color:var(--muted);background:var(--panel);padding:3px 12px;border-radius:99px;margin:10px 0}
.composer{position:relative;display:flex;align-items:flex-end;gap:6px;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line)}
#text{flex:1;resize:none;max-height:120px;padding:11px 14px;border-radius:20px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit;outline:0}
.send{width:42px;height:42px;border-radius:50%;background:var(--grad);color:#fff;font-size:18px}
#emoji{position:absolute;bottom:calc(100% + 6px);left:12px;width:min(320px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px;display:grid;grid-template-columns:repeat(8,1fr);box-shadow:0 10px 40px #0005}
#emoji button{font-size:22px;padding:4px;border-radius:8px}
#emoji button:hover{background:var(--panel2)}
#lightbox{position:fixed;inset:0;background:#000d;display:grid;place-items:center;z-index:9;cursor:zoom-out}
#lightbox img{max-width:94vw;max-height:94vh;border-radius:12px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;z-index:10}
@media(max-width:760px){
#app{grid-template-columns:1fr}
#app aside{grid-area:1/1}#app main{grid-area:1/1}
#app:not(.open) main{display:none}
#app.open aside{display:none}
.head .back{display:block}
}
</style>
</head>
<body>

<section id="auth">
  <div class="card">
    <div class="brand"><div class="logo" id="authLogo" style="margin:auto"></div><h1>Искра</h1><p>Мессенджер, который зажигает общение</p></div>
    <div class="tabs"><button class="on" data-mode="login">Вход</button><button data-mode="register">Регистрация</button></div>
    <div class="field"><input id="username" placeholder="Логин (латиница, цифры, _)" autocomplete="username" autocapitalize="none"></div>
    <div class="field"><input id="password" type="password" placeholder="Пароль (от 6 символов)" autocomplete="current-password"></div>
    <div class="field hidden" id="repeatField"><input id="password2" type="password" placeholder="Повторите пароль" autocomplete="new-password"></div>
    <button class="btn" id="authBtn">Войти</button>
    <div class="err" id="authErr"></div>
  </div>
</section>

<div id="app" class="hidden">
  <aside>
    <div class="me"><div class="logo" id="meLogo"></div><b id="meName"></b><button class="icon-btn" id="logout" title="Выйти">⎋</button></div>
    <input id="search" placeholder="Поиск людей">
    <div id="list"></div>
  </aside>
  <main>
    <div class="head"><button class="icon-btn back" id="back">←</button><div class="ava" id="chatAva"></div><b id="chatTitle"></b></div>
    <div id="msgs"></div>
    <div class="composer">
      <div id="emoji" class="hidden"></div>
      <button class="icon-btn" id="emojiBtn" title="Смайлики">😊</button>
      <button class="icon-btn" id="imgBtn" title="Картинка">🖼</button>
      <input type="file" id="file" accept="image/*" class="hidden">
      <textarea id="text" rows="1" placeholder="Сообщение…"></textarea>
      <button class="send" id="send" title="Отправить">➤</button>
    </div>
  </main>
</div>

<script type="module">
/*
 Архитектура: Validators (чистые правила) → AuthService / ChatService (Firebase)
 → ImageCompressor (картинки) → View (DOM) → App (связывает всё).
 Картинки сжимаются и хранятся прямо в сообщении (Firestore), поэтому платный Storage не нужен.
*/
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDH4JqdICmjf_IzC2h58arcQiSAWkV4AcA",
  authDomain: "messenger-41f5f.firebaseapp.com",
  projectId: "messenger-41f5f",
  appId: "1:663121888236:web:f5997f256fd153fde9b6c9"
};

const LOGO = `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ff4d6d"/></linearGradient></defs><rect width="64" height="64" rx="18" fill="url(#g)"/><path d="M36 8 18 36h12l-4 20 20-30H34z" fill="#fff"/></svg>`;
const EMOJIS = "😀😂🤣😊😍😘😎🤔😢😭😡🥳😴🤯🙄😉👍👎👏🙏💪🔥✨⚡❤️💔🎉🎁☕🍕🐱🐶🌈☀️🌙⭐🚀💡📌✅❌👀🤝🙌😇🤗😅😬🥰🤩😜😏".match(/\p{Extended_Pictographic}\uFE0F?/gu);
const GENERAL = "general";
const MAX_IMAGE_CHARS = 700_000;

class Validators {
  static username(v) { return /^[a-zA-Z0-9_]{3,20}$/.test(v); }
  static password(v) { return typeof v === "string" && v.length >= 6; }
  static email(username) { return `${username.toLowerCase()}@iskra.app`; }
  static chatId(a, b) { return [a, b].sort().join("_"); }
  // displayName появляется чуть позже входа при регистрации, поэтому нужен запасной вариант из почты
  static displayName(user) { return user.displayName || user.email?.split("@")[0] || "?"; }
}

class AuthService {
  constructor(app) { this.auth = getAuth(app); this.db = getFirestore(app); }
  onChange(cb) { return onAuthStateChanged(this.auth, cb); }
  async register(username, password) {
    const { user } = await createUserWithEmailAndPassword(this.auth, Validators.email(username), password);
    await updateProfile(user, { displayName: username });
    await setDoc(doc(this.db, "iskra_users", user.uid), { name: username, createdAt: serverTimestamp() });
  }
  login(username, password) { return signInWithEmailAndPassword(this.auth, Validators.email(username), password); }
  logout() { return signOut(this.auth); }
}

class ChatService {
  constructor(app) { this.db = getFirestore(app); }
  watchUsers(cb) {
    return onSnapshot(collection(this.db, "iskra_users"), s => cb(s.docs.map(d => ({ uid: d.id, ...d.data() }))));
  }
  watchMessages(chatId, cb) {
    const q = query(collection(this.db, "iskra_chats", chatId, "messages"), orderBy("createdAt", "desc"), limit(200));
    return onSnapshot(q, s => cb(s.docs.map(d => {
      const m = d.data({ serverTimestamps: "estimate" });
      return { id: d.id, ...m, at: m.createdAt?.toDate?.() ?? new Date() };
    }).reverse()));
  }
  send(chatId, user, { text = "", image = "" }) {
    return addDoc(collection(this.db, "iskra_chats", chatId, "messages"), {
      uid: user.uid, name: Validators.displayName(user), text, image, createdAt: serverTimestamp()
    });
  }
}

class ImageCompressor {
  static async compress(file, maxSide = 960) {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
    const c = Object.assign(document.createElement("canvas"), { width: Math.round(bmp.width * k), height: Math.round(bmp.height * k) });
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    for (const q of [0.8, 0.6, 0.4]) {
      const url = c.toDataURL("image/jpeg", q);
      if (url.length <= MAX_IMAGE_CHARS) return url;
    }
    throw new Error("Картинка слишком большая");
  }
}

class View {
  $ = id => document.getElementById(id);
  static color(s) { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) % 360; return `hsl(${h} 65% 52%)`; }
  avatar(el, name) { el.textContent = (name[0] || "?").toUpperCase(); el.style.background = View.color(name); }
  toast(msg) {
    const t = Object.assign(document.createElement("div"), { id: "toast", textContent: msg });
    document.body.append(t); setTimeout(() => t.remove(), 2500);
  }
  renderList(users, me, active, filter, onPick) {
    const list = this.$("list"); list.replaceChildren();
    const entries = [{ uid: GENERAL, name: "Общий чат", sub: "Все участники" },
      ...users.filter(u => u.uid !== me.uid).map(u => ({ ...u, sub: "Личный чат" }))]
      .filter(e => e.name.toLowerCase().includes(filter.toLowerCase()));
    for (const e of entries) {
      const b = document.createElement("button");
      b.className = "item" + (e.uid === active ? " on" : "");
      const a = document.createElement("div"); a.className = "ava";
      e.uid === GENERAL ? (a.textContent = "⚡", a.style.background = "var(--grad)") : this.avatar(a, e.name);
      const t = document.createElement("div"); const n = document.createElement("b"); n.textContent = e.name;
      const s = document.createElement("small"); s.textContent = e.sub; t.append(n, s);
      b.append(a, t); b.onclick = () => onPick(e); list.append(b);
    }
  }
  renderMessages(msgs, me) {
    const box = this.$("msgs"); const stick = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
    box.replaceChildren();
    if (!msgs.length) {
      const e = document.createElement("div"); e.className = "empty"; e.textContent = "Здесь пока тихо. Высеките первую искру ⚡"; box.append(e); return;
    }
    let lastDay = "";
    for (const m of msgs) {
      const day = m.at.toLocaleDateString("ru", { day: "numeric", month: "long" });
      if (day !== lastDay) { const d = document.createElement("div"); d.className = "day"; d.textContent = day; box.append(d); lastDay = day; }
      const mine = m.uid === me.uid;
      const row = document.createElement("div"); row.className = "row" + (mine ? " mine" : "");
      const a = document.createElement("div"); a.className = "ava"; this.avatar(a, m.name || "?");
      const bub = document.createElement("div"); bub.className = "bubble";
      if (!mine) { const w = document.createElement("div"); w.className = "who"; w.textContent = m.name; w.style.color = View.color(m.name || "?"); bub.append(w); }
      if (m.image) { const i = document.createElement("img"); i.src = m.image; i.alt = "Картинка"; i.onclick = () => this.lightbox(m.image); bub.append(i); }
      if (m.text) { const t = document.createElement("div"); t.className = "txt"; t.textContent = m.text; bub.append(t); }
      const tm = document.createElement("div"); tm.className = "time"; tm.textContent = m.at.toLocaleTimeString("ru", { hour: "2-digit", minute: "2-digit" }); bub.append(tm);
      row.append(a, bub); box.append(row);
    }
    if (stick || msgs.at(-1).uid === me.uid) box.scrollTop = box.scrollHeight;
  }
  lightbox(src) {
    const l = document.createElement("div"); l.id = "lightbox"; l.innerHTML = "<img>"; l.firstChild.src = src; l.onclick = () => l.remove(); document.body.append(l);
  }
}

class App {
  constructor() {
    this.v = new View();
    const fb = initializeApp(FIREBASE_CONFIG);
    this.authSvc = new AuthService(fb); this.chat = new ChatService(fb);
    this.mode = "login"; this.me = null; this.users = []; this.active = { uid: GENERAL, name: "Общий чат" };
    this.unsubMsgs = null; this.unsubUsers = null;
  }
  start() {
    const { $ } = this.v;
    document.getElementById("favicon").href = "data:image/svg+xml," + encodeURIComponent(LOGO);
    $("authLogo").innerHTML = LOGO; $("meLogo").innerHTML = LOGO;
    $("emoji").append(...EMOJIS.map(e => Object.assign(document.createElement("button"), { textContent: e, onclick: () => this.insertEmoji(e) })));
    document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => this.setMode(b.dataset.mode));
    $("authBtn").onclick = () => this.submitAuth();
    $("password").onkeydown = $("password2").onkeydown = e => e.key === "Enter" && this.submitAuth();
    $("logout").onclick = () => this.authSvc.logout();
    $("search").oninput = () => this.refreshList();
    $("back").onclick = () => $("app").classList.remove("open");
    $("send").onclick = () => this.sendText();
    $("text").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); this.sendText(); } };
    $("text").oninput = e => { e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + "px"; };
    $("emojiBtn").onclick = () => $("emoji").classList.toggle("hidden");
    $("imgBtn").onclick = () => $("file").click();
    $("file").onchange = e => this.sendImage(e.target.files[0]).finally(() => (e.target.value = ""));
    this.authSvc.onChange(u => u ? this.enter(u) : this.leave());
  }
  setMode(mode) {
    this.mode = mode; const { $ } = this.v;
    document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.mode === mode));
    $("repeatField").classList.toggle("hidden", mode === "login");
    $("authBtn").textContent = mode === "login" ? "Войти" : "Создать аккаунт";
    $("authErr").textContent = "";
  }
  async submitAuth() {
    const { $ } = this.v; const u = $("username").value.trim(), p = $("password").value;
    const fail = m => ($("authErr").textContent = m);
    if (!Validators.username(u)) return fail("Логин: 3–20 символов, латиница, цифры и _");
    if (!Validators.password(p)) return fail("Пароль должен быть не короче 6 символов");
    if (this.mode === "register" && p !== $("password2").value) return fail("Пароли не совпадают");
    $("authBtn").disabled = true; fail("");
    try { this.mode === "login" ? await this.authSvc.login(u, p) : await this.authSvc.register(u, p); }
    catch (e) { fail(App.authError(e.code)); }
    finally { $("authBtn").disabled = false; }
  }
  static authError(code) {
    return ({ "auth/email-already-in-use": "Такой логин уже занят", "auth/invalid-credential": "Неверный логин или пароль",
      "auth/user-not-found": "Пользователь не найден", "auth/wrong-password": "Неверный пароль",
      "auth/too-many-requests": "Слишком много попыток, подождите", "auth/network-request-failed": "Нет соединения с сетью",
      "auth/operation-not-allowed": "Включите Email/Password в Firebase Authentication" })[code] || "Ошибка: " + code;
  }
  enter(user) {
    this.me = user; const { $ } = this.v;
    $("auth").classList.add("hidden"); $("app").classList.remove("hidden"); $("meName").textContent = Validators.displayName(user);
    this.unsubUsers = this.chat.watchUsers(list => { this.users = list; this.refreshList(); });
    this.openChat(this.active, false);
  }
  leave() {
    this.unsubMsgs?.(); this.unsubUsers?.(); this.me = null;
    this.v.$("app").classList.add("hidden"); this.v.$("auth").classList.remove("hidden");
    this.v.$("password").value = ""; this.v.$("password2").value = "";
  }
  refreshList() { this.v.renderList(this.users, this.me, this.active.uid, this.v.$("search").value, e => this.openChat(e, true)); }
  chatId() { return this.active.uid === GENERAL ? GENERAL : Validators.chatId(this.me.uid, this.active.uid); }
  openChat(entry, mobile) {
    this.active = entry; const { $ } = this.v;
    $("chatTitle").textContent = entry.name;
    entry.uid === GENERAL ? ($("chatAva").textContent = "⚡", $("chatAva").style.background = "var(--grad)") : this.v.avatar($("chatAva"), entry.name);
    if (mobile) $("app").classList.add("open");
    this.refreshList(); this.unsubMsgs?.();
    this.unsubMsgs = this.chat.watchMessages(this.chatId(), m => this.v.renderMessages(m, this.me));
  }
  insertEmoji(e) { const t = this.v.$("text"); t.value += e; t.focus(); }
  async sendText() {
    const t = this.v.$("text"); const text = t.value.trim(); if (!text) return;
    t.value = ""; t.style.height = "auto"; this.v.$("emoji").classList.add("hidden");
    try { await this.chat.send(this.chatId(), this.me, { text }); } catch { t.value = text; this.v.toast("Не удалось отправить"); }
  }
  async sendImage(file) {
    if (!file) return;
    try { await this.chat.send(this.chatId(), this.me, { image: await ImageCompressor.compress(file) }); }
    catch (e) { this.v.toast(e.message || "Не удалось отправить картинку"); }
  }
}

if (location.hash === "#test") {
  console.assert(Validators.username("ab") === false, "short username");
  console.assert(Validators.username("Iskra_1") === true, "valid username");
  console.assert(Validators.username("жук") === false, "cyrillic username");
  console.assert(Validators.password("12345") === false && Validators.password("123456"), "password");
  console.assert(Validators.chatId("b", "a") === Validators.chatId("a", "b"), "chatId symmetric");
  console.assert(Validators.email("Bob") === "bob@iskra.app", "email");
  console.assert(Validators.displayName({ email: "bob@iskra.app" }) === "bob", "displayName fallback");
  console.log("Тесты Validators пройдены");
}

new App().start();
</script>
</body>
</html>
